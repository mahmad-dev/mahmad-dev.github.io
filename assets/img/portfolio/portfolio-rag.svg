<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="JetBrains Mono, monospace">
  <defs>
    <linearGradient id="bgR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0c10"/>
      <stop offset="100%" stop-color="#12131c"/>
    </linearGradient>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="url(#bgR)"/>

  <text x="60" y="70" fill="#f3f4f6" font-size="30" font-weight="700">RAG Architecture Knowledge Base</text>
  <text x="60" y="100" fill="#6b7280" font-size="16">Natural-language search over internal docs and codebase</text>

  <!-- Docs input -->
  <rect x="60" y="160" width="210" height="110" rx="8" fill="#1a1c23" stroke="#262833"/>
  <text x="165" y="205" fill="#f3f4f6" font-size="16" text-anchor="middle" font-weight="600">Docs &amp; Codebase</text>
  <text x="165" y="228" fill="#6b7280" font-size="12" text-anchor="middle">architecture, guidelines</text>

  <line x1="270" y1="215" x2="350" y2="215" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrR)"/>

  <!-- Chunk + embed -->
  <rect x="360" y="160" width="210" height="110" rx="8" fill="#1a1c23" stroke="#262833"/>
  <text x="465" y="200" fill="#f3f4f6" font-size="16" text-anchor="middle" font-weight="600">Chunk &amp; Embed</text>
  <text x="465" y="223" fill="#6b7280" font-size="12" text-anchor="middle">vector embeddings</text>

  <line x1="570" y1="215" x2="650" y2="215" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrR)"/>

  <!-- Vector DB -->
  <rect x="660" y="160" width="210" height="110" rx="8" fill="#1a1c23" stroke="#10b981"/>
  <text x="765" y="200" fill="#f3f4f6" font-size="16" text-anchor="middle" font-weight="600">Vector DB</text>
  <text x="765" y="223" fill="#10b981" font-size="12" text-anchor="middle">Chroma / Pinecone</text>

  <!-- down to query -->
  <line x1="165" y1="270" x2="165" y2="330" stroke="#262833" stroke-width="2"/>
  <line x1="765" y1="270" x2="765" y2="330" stroke="#262833" stroke-width="2"/>

  <!-- Query -->
  <rect x="60" y="340" width="210" height="100" rx="8" fill="#1a1c23" stroke="#262833"/>
  <text x="165" y="380" fill="#f3f4f6" font-size="16" text-anchor="middle" font-weight="600">User Query</text>
  <text x="165" y="402" fill="#6b7280" font-size="12" text-anchor="middle">plain-English question</text>

  <line x1="270" y1="390" x2="700" y2="390" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrR)"/>

  <!-- Retrieval -->
  <rect x="710" y="340" width="230" height="100" rx="8" fill="#1a1c23" stroke="#f59e0b"/>
  <text x="825" y="380" fill="#f3f4f6" font-size="16" text-anchor="middle" font-weight="600">Retrieval</text>
  <text x="825" y="402" fill="#f59e0b" font-size="12" text-anchor="middle">top-k relevant chunks</text>

  <line x1="765" y1="270" x2="825" y2="340" stroke="#262833" stroke-width="2"/>

  <line x1="825" y1="440" x2="825" y2="500" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrR)"/>

  <!-- LLM -->
  <rect x="700" y="510" width="240" height="100" rx="8" fill="#1a1c23" stroke="#3b82f6"/>
  <text x="820" y="550" fill="#f3f4f6" font-size="16" text-anchor="middle" font-weight="600">LLM + Context</text>
  <text x="820" y="572" fill="#3b82f6" font-size="12" text-anchor="middle">system prompt + chunks</text>

  <line x1="700" y1="560" x2="290" y2="560" stroke="#10b981" stroke-width="2" marker-end="url(#arrR)"/>

  <!-- Answer -->
  <rect x="60" y="510" width="220" height="100" rx="8" fill="#1a1c23" stroke="#10b981"/>
  <text x="170" y="550" fill="#f3f4f6" font-size="16" text-anchor="middle" font-weight="600">Answer</text>
  <text x="170" y="572" fill="#10b981" font-size="12" text-anchor="middle">grounded in source docs</text>

  <text x="60" y="700" fill="#6b7280" font-size="13">LangChain &#183; Python &#183; NestJS &#183; Vector Search &#183; RAG</text>
</svg>
