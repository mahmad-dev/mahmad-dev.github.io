<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="JetBrains Mono, monospace">
  <defs>
    <linearGradient id="ragBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0c10"/>
      <stop offset="100%" stop-color="#12131c"/>
    </linearGradient>
    <radialGradient id="ragWashA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ragWashB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <filter id="ragGrain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>

  <rect width="1200" height="800" fill="url(#ragBg)"/>
  <circle cx="200" cy="620" r="380" fill="url(#ragWashA)"/>
  <circle cx="1000" cy="160" r="360" fill="url(#ragWashB)"/>
  <rect width="1200" height="800" filter="url(#ragGrain)" opacity="0.05"/>

  <text x="70" y="92" fill="#9ca3af" font-size="15" letter-spacing="2">KNOWLEDGE RAG</text>
  <text x="70" y="118" fill="#6b7285" font-size="13" letter-spacing="1.5">AI &amp; AUTOMATION</text>

  <text x="66" y="430" fill="#f3f4f6" font-size="220" font-weight="700" font-family="Georgia, 'Times New Roman', serif">0</text>
  <text x="70" y="480" fill="#c7cbd6" font-size="24" font-family="Arial, sans-serif">senior engineers pulled in to answer</text>
  <text x="70" y="514" fill="#6b7285" font-size="15">"why is it built this way?" now gets a sourced answer, not a Slack ping</text>

  <line x1="70" y1="560" x2="1130" y2="560" stroke="#20232e"/>
  <text x="70" y="596" fill="#6b7285" font-size="13">LangChain</text>
  <text x="210" y="596" fill="#6b7285" font-size="13">Vector search</text>
  <text x="380" y="596" fill="#6b7285" font-size="13">Embeddings</text>

  <text x="1130" y="750" fill="#e8eaf0" opacity="0.9" font-size="22" font-weight="700" text-anchor="end" letter-spacing="2">RAG</text>
</svg>
