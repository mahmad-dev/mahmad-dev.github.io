<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="JetBrains Mono, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0c10"/>
      <stop offset="100%" stop-color="#12131c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- title -->
  <text x="60" y="70" fill="#f3f4f6" font-size="30" font-weight="700">Data-Integrity Layer for a LangChain QnA System</text>
  <text x="60" y="100" fill="#6b7280" font-size="16">Fingerprint at upload &#8594; anchor on-chain &#8594; re-verify before it reaches the model</text>

  <!-- Document upload -->
  <rect x="60" y="160" width="230" height="120" rx="8" fill="#1a1c23" stroke="#262833"/>
  <text x="175" y="205" fill="#f3f4f6" font-size="18" text-anchor="middle" font-weight="600">Document</text>
  <text x="175" y="230" fill="#9ca3af" font-size="14" text-anchor="middle">Upload</text>
  <text x="175" y="252" fill="#6b7280" font-size="12" text-anchor="middle">hash &#183; filename &#183; size</text>

  <!-- arrow 1 -->
  <line x1="290" y1="220" x2="380" y2="220" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Fingerprint record -->
  <rect x="390" y="160" width="230" height="120" rx="8" fill="#1a1c23" stroke="#262833"/>
  <text x="505" y="205" fill="#f3f4f6" font-size="18" text-anchor="middle" font-weight="600">Fingerprint</text>
  <text x="505" y="230" fill="#9ca3af" font-size="14" text-anchor="middle">Record</text>
  <text x="505" y="252" fill="#6b7280" font-size="12" text-anchor="middle">identifiers stored at upload</text>

  <!-- arrow 2 -->
  <line x1="620" y1="220" x2="710" y2="220" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Anchor -->
  <rect x="720" y="160" width="230" height="120" rx="8" fill="#1a1c23" stroke="#10b981"/>
  <text x="835" y="205" fill="#f3f4f6" font-size="18" text-anchor="middle" font-weight="600">On-Chain Anchor</text>
  <text x="835" y="230" fill="#10b981" font-size="14" text-anchor="middle">Polygon</text>
  <text x="835" y="252" fill="#6b7280" font-size="12" text-anchor="middle">content pinned via IPFS/Pinata</text>

  <!-- arrow down from anchor to retrieval -->
  <line x1="835" y1="280" x2="835" y2="360" stroke="#262833" stroke-width="2"/>
  <line x1="505" y1="280" x2="505" y2="360" stroke="#262833" stroke-width="2"/>
  <line x1="175" y1="280" x2="175" y2="360" stroke="#262833" stroke-width="2"/>

  <!-- Retrieval step -->
  <rect x="390" y="400" width="420" height="110" rx="8" fill="#1a1c23" stroke="#262833"/>
  <text x="600" y="440" fill="#f3f4f6" font-size="18" text-anchor="middle" font-weight="600">Retrieval at Inference Time</text>
  <text x="600" y="465" fill="#9ca3af" font-size="14" text-anchor="middle">LangChain QnA over EU fake-news dataset</text>
  <text x="600" y="488" fill="#6b7280" font-size="12" text-anchor="middle">retrieved context re-checked against its recorded fingerprint</text>

  <!-- arrow to verify -->
  <line x1="600" y1="510" x2="600" y2="580" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- verify gate -->
  <rect x="420" y="590" width="360" height="90" rx="8" fill="#1a1c23" stroke="#f59e0b"/>
  <text x="600" y="628" fill="#f3f4f6" font-size="17" text-anchor="middle" font-weight="600">Tamper / Poisoning Check</text>
  <text x="600" y="652" fill="#f59e0b" font-size="13" text-anchor="middle">mismatch &#8594; context rejected before reaching the LLM</text>

  <!-- arrow to LLM -->
  <line x1="780" y1="635" x2="900" y2="635" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LLM box -->
  <rect x="910" y="590" width="230" height="90" rx="8" fill="#1a1c23" stroke="#3b82f6"/>
  <text x="1025" y="628" fill="#f3f4f6" font-size="17" text-anchor="middle" font-weight="600">LLM Response</text>
  <text x="1025" y="652" fill="#9ca3af" font-size="12" text-anchor="middle">verified context only</text>

  <text x="60" y="760" fill="#6b7280" font-size="13">LangChain &#183; Python &#183; Polygon &#183; IPFS &#183; Pinata &#183; NestJS &#183; RAG</text>
</svg>
