<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="JetBrains Mono, monospace">
  <defs>
    <linearGradient id="diBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0c10"/>
      <stop offset="100%" stop-color="#12131c"/>
    </linearGradient>
    <radialGradient id="diWashA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="diWashB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="diGrain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>

  <rect width="1200" height="800" fill="url(#diBg)"/>
  <circle cx="240" cy="160" r="360" fill="url(#diWashA)"/>
  <circle cx="1000" cy="660" r="380" fill="url(#diWashB)"/>
  <rect width="1200" height="800" filter="url(#diGrain)" opacity="0.05"/>

  <text x="70" y="92" fill="#9ca3af" font-size="15" letter-spacing="2">DATA-INTEGRITY LAYER</text>
  <text x="70" y="118" fill="#6b7285" font-size="13" letter-spacing="1.5">RESEARCH · TU ILMENAU</text>

  <text x="66" y="410" fill="#f3f4f6" font-size="130" font-weight="700" font-family="Georgia, 'Times New Roman', serif">M.Sc.</text>
  <text x="70" y="462" fill="#c7cbd6" font-size="24" font-family="Arial, sans-serif">blockchain-anchored fingerprints over a RAG corpus</text>
  <text x="70" y="496" fill="#6b7285" font-size="15">re-verified at inference, so a poisoned answer gets caught first, not the user</text>

  <line x1="70" y1="542" x2="1130" y2="542" stroke="#20232e"/>
  <text x="70" y="578" fill="#6b7285" font-size="13">LangChain</text>
  <text x="210" y="578" fill="#6b7285" font-size="13">Merkle proofs</text>
  <text x="390" y="578" fill="#6b7285" font-size="13">Smart contracts</text>
  <text x="70" y="608" fill="#818cf8" font-size="13.5">paper in progress</text>

  <text x="1130" y="750" fill="#e8eaf0" opacity="0.9" font-size="22" font-weight="700" text-anchor="end" letter-spacing="2">DI</text>
</svg>
