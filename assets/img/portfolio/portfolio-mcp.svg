<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="JetBrains Mono, monospace">
  <defs>
    <linearGradient id="mcpBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0c10"/>
      <stop offset="100%" stop-color="#12131c"/>
    </linearGradient>
    <radialGradient id="mcpWashA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mcpWashB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="mcpGrain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>

  <rect width="1200" height="800" fill="url(#mcpBg)"/>
  <circle cx="220" cy="180" r="360" fill="url(#mcpWashA)"/>
  <circle cx="1020" cy="640" r="380" fill="url(#mcpWashB)"/>
  <rect width="1200" height="800" filter="url(#mcpGrain)" opacity="0.05"/>

  <text x="70" y="92" fill="#9ca3af" font-size="15" letter-spacing="2">MCP GATEWAY</text>
  <text x="70" y="118" fill="#6b7285" font-size="13" letter-spacing="1.5">AI &amp; AUTOMATION</text>

  <text x="66" y="430" fill="#f3f4f6" font-size="180" font-weight="700" font-family="Georgia, 'Times New Roman', serif">~30%</text>
  <text x="70" y="480" fill="#c7cbd6" font-size="24" font-family="Arial, sans-serif">fewer manual developer lookups</text>
  <text x="70" y="514" fill="#6b7285" font-size="15">once agents could resolve internal APIs as typed, permissioned tools</text>

  <line x1="70" y1="560" x2="1130" y2="560" stroke="#20232e"/>
  <text x="70" y="596" fill="#6b7285" font-size="13">TypeScript</text>
  <text x="210" y="596" fill="#6b7285" font-size="13">Internal APIs</text>
  <text x="380" y="596" fill="#6b7285" font-size="13">RBAC-scoped tools</text>

  <text x="1130" y="750" fill="#e8eaf0" opacity="0.9" font-size="22" font-weight="700" text-anchor="end" letter-spacing="2">MCP</text>
</svg>
