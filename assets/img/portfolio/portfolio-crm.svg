<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="JetBrains Mono, monospace">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0c10"/>
      <stop offset="100%" stop-color="#12131c"/>
    </linearGradient>
    <marker id="arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="url(#bgC)"/>

  <text x="60" y="70" fill="#f3f4f6" font-size="30" font-weight="700">High-Scale Property CRM Engine</text>
  <text x="60" y="100" fill="#6b7280" font-size="16">Production backend infrastructure serving 40M+ monthly users</text>

  <!-- Clients -->
  <rect x="60" y="150" width="230" height="90" rx="8" fill="#1a1c23" stroke="#262833"/>
  <text x="175" y="188" fill="#f3f4f6" font-size="16" text-anchor="middle" font-weight="600">Web &amp; Mobile Clients</text>
  <text x="175" y="210" fill="#6b7280" font-size="12" text-anchor="middle">Zameen.com &#183; Propforce &#183; Bayut.sa</text>

  <line x1="290" y1="195" x2="380" y2="195" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrC)"/>

  <!-- API Gateway -->
  <rect x="390" y="150" width="230" height="90" rx="8" fill="#1a1c23" stroke="#3b82f6"/>
  <text x="505" y="188" fill="#f3f4f6" font-size="16" text-anchor="middle" font-weight="600">API Gateway</text>
  <text x="505" y="210" fill="#3b82f6" font-size="12" text-anchor="middle">NestJS &#183; TypeScript</text>

  <!-- branch to core services -->
  <line x1="505" y1="240" x2="505" y2="290" stroke="#262833" stroke-width="2"/>
  <line x1="290" y1="290" x2="720" y2="290" stroke="#262833" stroke-width="2"/>
  <line x1="290" y1="290" x2="290" y2="330" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrC)"/>
  <line x1="505" y1="290" x2="505" y2="330" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrC)"/>
  <line x1="720" y1="290" x2="720" y2="330" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrC)"/>

  <!-- Core services row -->
  <rect x="175" y="340" width="230" height="90" rx="8" fill="#1a1c23" stroke="#262833"/>
  <text x="290" y="378" fill="#f3f4f6" font-size="15" text-anchor="middle" font-weight="600">Core CRM Services</text>
  <text x="290" y="400" fill="#6b7280" font-size="12" text-anchor="middle">listings, transactions</text>

  <rect x="390" y="340" width="230" height="90" rx="8" fill="#1a1c23" stroke="#10b981"/>
  <text x="505" y="378" fill="#f3f4f6" font-size="15" text-anchor="middle" font-weight="600">Mortgage Engine</text>
  <text x="505" y="400" fill="#10b981" font-size="12" text-anchor="middle">5,000+ active clients</text>

  <rect x="605" y="340" width="230" height="90" rx="8" fill="#1a1c23" stroke="#262833"/>
  <text x="720" y="378" fill="#f3f4f6" font-size="15" text-anchor="middle" font-weight="600">Background Workers</text>
  <text x="720" y="400" fill="#6b7280" font-size="12" text-anchor="middle">parallel cron jobs</text>

  <!-- down to data layer -->
  <line x1="290" y1="430" x2="290" y2="480" stroke="#262833" stroke-width="2"/>
  <line x1="505" y1="430" x2="505" y2="480" stroke="#262833" stroke-width="2"/>
  <line x1="720" y1="430" x2="720" y2="480" stroke="#262833" stroke-width="2"/>
  <line x1="290" y1="480" x2="720" y2="480" stroke="#262833" stroke-width="2"/>
  <line x1="505" y1="480" x2="505" y2="520" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrC)"/>

  <!-- Data layer -->
  <rect x="330" y="530" width="210" height="90" rx="8" fill="#1a1c23" stroke="#f59e0b"/>
  <text x="435" y="568" fill="#f3f4f6" font-size="15" text-anchor="middle" font-weight="600">MySQL / PostgreSQL</text>
  <text x="435" y="590" fill="#f59e0b" font-size="12" text-anchor="middle">optimized schemas &amp; indexes</text>

  <rect x="565" y="530" width="200" height="90" rx="8" fill="#1a1c23" stroke="#262833"/>
  <text x="665" y="568" fill="#f3f4f6" font-size="15" text-anchor="middle" font-weight="600">Redis</text>
  <text x="665" y="590" fill="#6b7280" font-size="12" text-anchor="middle">cache &amp; observability</text>

  <line x1="540" y1="575" x2="565" y2="575" stroke="#262833" stroke-width="2"/>

  <text x="60" y="700" fill="#6b7280" font-size="13">Node.js &#183; TypeScript &#183; NestJS &#183; MySQL &#183; PostgreSQL &#183; Redis &#183; AWS &#183; RBAC Logging</text>
  <text x="60" y="725" fill="#3b82f6" font-size="14" font-weight="600">40M+ monthly users &#183; 45% latency reduction on core queries</text>
</svg>
