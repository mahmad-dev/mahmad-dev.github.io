<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="JetBrains Mono, monospace">
  <defs>
    <linearGradient id="avaBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0c10"/>
      <stop offset="100%" stop-color="#12131c"/>
    </linearGradient>
    <radialGradient id="avaWashA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="avaWashB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="avaGrain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>

  <rect width="1200" height="800" fill="url(#avaBg)"/>
  <circle cx="220" cy="640" r="380" fill="url(#avaWashA)"/>
  <circle cx="1010" cy="150" r="360" fill="url(#avaWashB)"/>
  <rect width="1200" height="800" filter="url(#avaGrain)" opacity="0.05"/>

  <text x="70" y="92" fill="#9ca3af" font-size="15" letter-spacing="2">AVA</text>
  <text x="70" y="118" fill="#6b7285" font-size="13" letter-spacing="1.5">AI COPILOT &amp; DELIVERY PIPELINE</text>

  <text x="66" y="420" fill="#f3f4f6" font-size="150" font-weight="700" font-family="Georgia, 'Times New Roman', serif">40 → 6<tspan font-size="60" fill="#6b7285"> min</tspan></text>
  <text x="70" y="472" fill="#c7cbd6" font-size="24" font-family="Arial, sans-serif">PR prep time, automated end to end</text>
  <text x="70" y="506" fill="#6b7285" font-size="15">a chat request becomes a wireframe, a Jira ticket, and a reviewed PR</text>

  <line x1="70" y1="552" x2="1130" y2="552" stroke="#20232e"/>
  <text x="70" y="588" fill="#6b7285" font-size="13">Claude API</text>
  <text x="220" y="588" fill="#6b7285" font-size="13">Node.js</text>
  <text x="360" y="588" fill="#6b7285" font-size="13">Jira API</text>
  <text x="70" y="618" fill="#22d3ee" font-size="13.5">used across multiple product teams at Dubizzle</text>

  <text x="1130" y="750" fill="#e8eaf0" opacity="0.9" font-size="22" font-weight="700" text-anchor="end" letter-spacing="2">AVA</text>
</svg>
