<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="JetBrains Mono, monospace">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0c10"/>
      <stop offset="100%" stop-color="#12131c"/>
    </linearGradient>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="url(#bgA)"/>

  <text x="60" y="70" fill="#f3f4f6" font-size="30" font-weight="700">AVA &#8212; AI Copilot &amp; Delivery Pipeline</text>
  <text x="60" y="100" fill="#6b7280" font-size="16">Chat request &#8594; live data or shipped code, end to end</text>

  <!-- Chat request -->
  <rect x="60" y="150" width="220" height="100" rx="8" fill="#1a1c23" stroke="#262833"/>
  <text x="170" y="192" fill="#f3f4f6" font-size="17" text-anchor="middle" font-weight="600">Chat Request</text>
  <text x="170" y="215" fill="#6b7280" font-size="12" text-anchor="middle">SSO across products</text>

  <line x1="280" y1="200" x2="360" y2="200" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrA)"/>

  <!-- AVA core -->
  <rect x="370" y="140" width="230" height="120" rx="8" fill="#1a1c23" stroke="#3b82f6"/>
  <text x="485" y="185" fill="#f3f4f6" font-size="18" text-anchor="middle" font-weight="600">AVA</text>
  <text x="485" y="208" fill="#3b82f6" font-size="13" text-anchor="middle">AI Copilot Core</text>
  <text x="485" y="230" fill="#6b7280" font-size="12" text-anchor="middle">MCP servers per product</text>

  <!-- branch up: live data -->
  <line x1="600" y1="170" x2="680" y2="170" stroke="#10b981" stroke-width="2" marker-end="url(#arrA)"/>
  <rect x="690" y="120" width="230" height="100" rx="8" fill="#1a1c23" stroke="#10b981"/>
  <text x="805" y="160" fill="#f3f4f6" font-size="16" text-anchor="middle" font-weight="600">Live Data Query</text>
  <text x="805" y="182" fill="#10b981" font-size="12" text-anchor="middle">DB + OpenSearch &#8594; reports</text>

  <!-- branch down: requirements flow -->
  <line x1="600" y1="230" x2="680" y2="230" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrA)"/>
  <rect x="690" y="240" width="230" height="100" rx="8" fill="#1a1c23" stroke="#f59e0b"/>
  <text x="805" y="278" fill="#f3f4f6" font-size="16" text-anchor="middle" font-weight="600">Requirements Flow</text>
  <text x="805" y="300" fill="#f59e0b" font-size="12" text-anchor="middle">wireframe &#8594; Jira ticket</text>

  <!-- arrow down to pipeline -->
  <line x1="805" y1="340" x2="805" y2="400" stroke="#262833" stroke-width="2"/>
  <line x1="805" y1="400" x2="485" y2="400" stroke="#262833" stroke-width="2"/>
  <line x1="485" y1="400" x2="485" y2="440" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrA)"/>

  <!-- pipeline stages -->
  <rect x="60" y="450" width="220" height="100" rx="8" fill="#1a1c23" stroke="#262833"/>
  <text x="170" y="490" fill="#f3f4f6" font-size="16" text-anchor="middle" font-weight="600">Engineering Plan</text>
  <text x="170" y="512" fill="#6b7280" font-size="12" text-anchor="middle">Claude skill + branch/issue</text>

  <line x1="280" y1="500" x2="360" y2="500" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrA)"/>

  <rect x="370" y="450" width="230" height="100" rx="8" fill="#1a1c23" stroke="#262833"/>
  <text x="485" y="490" fill="#f3f4f6" font-size="16" text-anchor="middle" font-weight="600">Code + Tests</text>
  <text x="485" y="512" fill="#6b7280" font-size="12" text-anchor="middle">generated automatically</text>

  <line x1="600" y1="500" x2="680" y2="500" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrA)"/>

  <rect x="690" y="450" width="230" height="100" rx="8" fill="#1a1c23" stroke="#262833"/>
  <text x="805" y="490" fill="#f3f4f6" font-size="16" text-anchor="middle" font-weight="600">Pull Request</text>
  <text x="805" y="512" fill="#6b7280" font-size="12" text-anchor="middle">opened + Jira notified</text>

  <line x1="920" y1="500" x2="1000" y2="500" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrA)"/>

  <rect x="1010" y="450" width="130" height="100" rx="8" fill="#1a1c23" stroke="#10b981"/>
  <text x="1075" y="490" fill="#f3f4f6" font-size="16" text-anchor="middle" font-weight="600">QA</text>
  <text x="1075" y="512" fill="#10b981" font-size="12" text-anchor="middle">verifies &amp; merges</text>

  <text x="60" y="620" fill="#6b7280" font-size="13">NestJS &#183; Next.js &#183; PostgreSQL &#183; Redis &#183; MCP &#183; TypeScript &#183; Claude API</text>
  <text x="60" y="645" fill="#3b82f6" font-size="14" font-weight="600">PR prep time: ~40 min &#8594; ~6 min</text>
</svg>
