<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="JetBrains Mono, monospace">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0c10"/>
      <stop offset="100%" stop-color="#12131c"/>
    </linearGradient>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrGr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
    <marker id="arrGx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="url(#bgG)"/>

  <text x="60" y="70" fill="#f3f4f6" font-size="30" font-weight="700">rag-integrity-guard</text>
  <text x="60" y="100" fill="#6b7280" font-size="16">Fingerprint at ingestion, re-verify at retrieval — catch a poisoned chunk before the LLM sees it</text>

  <!-- Ingestion -->
  <rect x="60" y="160" width="220" height="100" rx="8" fill="#1a1c23" stroke="#262833"/>
  <text x="170" y="198" fill="#f3f4f6" font-size="15" text-anchor="middle" font-weight="600">Document chunk</text>
  <text x="170" y="220" fill="#6b7280" font-size="12" text-anchor="middle">ingested once</text>

  <line x1="280" y1="210" x2="360" y2="210" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrG)"/>

  <rect x="370" y="150" width="250" height="120" rx="8" fill="#1a1c23" stroke="#3b82f6"/>
  <text x="495" y="185" fill="#f3f4f6" font-size="16" text-anchor="middle" font-weight="600">Dual fingerprint</text>
  <rect x="392" y="200" width="200" height="30" rx="5" fill="#12131c" stroke="#262833"/>
  <text x="492" y="220" fill="#9ca3af" font-size="12" text-anchor="middle">BLAKE3 / SHA-256 hash</text>
  <rect x="392" y="235" width="200" height="30" rx="5" fill="#12131c" stroke="#262833"/>
  <text x="492" y="255" fill="#9ca3af" font-size="12" text-anchor="middle">L2-normalized embedding</text>

  <line x1="495" y1="270" x2="495" y2="330" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrG)"/>

  <rect x="370" y="340" width="250" height="70" rx="8" fill="#1a1c23" stroke="#262833"/>
  <text x="495" y="370" fill="#f3f4f6" font-size="14" text-anchor="middle" font-weight="600">Vector store</text>
  <text x="495" y="392" fill="#6b7280" font-size="11" text-anchor="middle">fingerprint kept alongside</text>

  <!-- Query path -->
  <line x1="495" y1="410" x2="495" y2="470" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrG)"/>

  <rect x="370" y="480" width="250" height="150" rx="8" fill="#1a1c23" stroke="#3b82f6"/>
  <text x="495" y="512" fill="#f3f4f6" font-size="16" text-anchor="middle" font-weight="600">IntegrityGuardRetriever</text>
  <text x="495" y="532" fill="#3b82f6" font-size="11" text-anchor="middle">re-verifies on every retrieval</text>

  <rect x="392" y="545" width="200" height="26" rx="5" fill="#12131c" stroke="#262833"/>
  <text x="492" y="563" fill="#9ca3af" font-size="11" text-anchor="middle">hash exact match?</text>
  <rect x="392" y="576" width="200" height="26" rx="5" fill="#12131c" stroke="#262833"/>
  <text x="492" y="594" fill="#9ca3af" font-size="11" text-anchor="middle">embedding still similar?</text>
  <rect x="392" y="607" width="200" height="26" rx="5" fill="#12131c" stroke="#262833"/>
  <text x="492" y="625" fill="#9ca3af" font-size="11" text-anchor="middle">STRICT / FILTER / LOG_ONLY</text>

  <!-- Outcomes -->
  <line x1="620" y1="500" x2="700" y2="440" stroke="#10b981" stroke-width="2" marker-end="url(#arrGr)"/>
  <rect x="710" y="395" width="220" height="60" rx="8" fill="#1a1c23" stroke="#10b981"/>
  <text x="820" y="422" fill="#10b981" font-size="14" text-anchor="middle" font-weight="700">VALID</text>
  <text x="820" y="442" fill="#6b7280" font-size="11" text-anchor="middle">reaches the LLM</text>

  <line x1="620" y1="555" x2="700" y2="555" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrGx)"/>
  <rect x="710" y="525" width="220" height="60" rx="8" fill="#1a1c23" stroke="#f59e0b"/>
  <text x="820" y="552" fill="#f59e0b" font-size="13" text-anchor="middle" font-weight="700">SEMANTIC_DRIFT</text>
  <text x="820" y="572" fill="#6b7280" font-size="11" text-anchor="middle">disguised swap, caught</text>

  <line x1="620" y1="610" x2="700" y2="655" stroke="#ef4444" stroke-width="2" marker-end="url(#arrGx)"/>
  <rect x="710" y="640" width="220" height="60" rx="8" fill="#1a1c23" stroke="#ef4444"/>
  <text x="820" y="667" fill="#ef4444" font-size="13" text-anchor="middle" font-weight="700">HASH_MISMATCH</text>
  <text x="820" y="687" fill="#6b7280" font-size="11" text-anchor="middle">blunt tamper, blocked</text>

  <!-- Stats callout -->
  <rect x="960" y="150" width="185" height="150" rx="8" fill="#12131c" stroke="#262833"/>
  <text x="1052" y="180" fill="#9ca3af" font-size="11" text-anchor="middle">FEVER benchmark, 500 pairs</text>
  <text x="1052" y="215" fill="#10b981" font-size="26" text-anchor="middle" font-weight="700">100%</text>
  <text x="1052" y="233" fill="#6b7280" font-size="10" text-anchor="middle">true-positive rate</text>
  <text x="1052" y="262" fill="#10b981" font-size="26" text-anchor="middle" font-weight="700">0%</text>
  <text x="1052" y="280" fill="#6b7280" font-size="10" text-anchor="middle">false-positive rate</text>

  <text x="60" y="720" fill="#6b7280" font-size="13">Python &#183; FastAPI &#183; LangChain &#183; Next.js 14 &#183; pytest (89 tests, 96%+ coverage)</text>
  <text x="60" y="745" fill="#3b82f6" font-size="14" font-weight="600">2.73ms mean verification overhead &#183; benchmarked against a public dataset, not a claimed number</text>
</svg>
