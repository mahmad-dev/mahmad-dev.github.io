<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="JetBrains Mono, monospace">
  <defs>
    <linearGradient id="rgBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0c10"/>
      <stop offset="100%" stop-color="#12131c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#rgBg)"/>

  <!-- window chrome -->
  <rect x="0" y="0" width="1200" height="64" fill="#0d0f15"/>
  <line x1="0" y1="64" x2="1200" y2="64" stroke="#20232e" stroke-width="1"/>
  <circle cx="34" cy="32" r="6" fill="#2a2d38"/>
  <circle cx="56" cy="32" r="6" fill="#2a2d38"/>
  <circle cx="78" cy="32" r="6" fill="#2a2d38"/>
  <rect x="112" y="19" width="300" height="26" rx="13" fill="#161a24"/>
  <text x="262" y="36" fill="#7b8394" font-size="11.5" text-anchor="middle">rag-integrity-guard · attack-simulator</text>

  <!-- ghost monogram -->
  <text x="1180" y="760" fill="#ffffff" opacity="0.045" font-size="300" font-weight="700" text-anchor="end" letter-spacing="-10">RG</text>

  <text x="48" y="112" fill="#6b7285" font-size="13" letter-spacing="1.5">INGESTED CHUNKS · LIVE VERIFICATION</text>

  <!-- valid row -->
  <rect x="48" y="132" width="1104" height="86" rx="10" fill="#11141c" stroke="#20232e"/>
  <text x="72" y="164" fill="#6b7285" font-size="13">chunk_0418</text>
  <text x="72" y="190" fill="#c7cbd6" font-size="15">"The treaty was signed in 1848."</text>
  <rect x="1000" y="158" width="128" height="30" rx="15" fill="rgba(52,211,153,0.14)" stroke="#34d399" stroke-opacity="0.5"/>
  <text x="1064" y="178" fill="#34d399" font-size="12.5" text-anchor="middle" font-weight="700">VALID</text>

  <!-- semantic drift row -->
  <rect x="48" y="230" width="1104" height="112" rx="10" fill="#11141c" stroke="#f59e0b" stroke-opacity="0.4"/>
  <text x="72" y="262" fill="#6b7285" font-size="13">chunk_0421 · tampered mid-scan</text>
  <text x="72" y="288" fill="#c7cbd6" font-size="15" text-decoration="line-through" fill-opacity="0.55">"Photosynthesis occurs in the chloroplast."</text>
  <text x="72" y="312" fill="#fbbf24" font-size="15">"Photosynthesis occurs in the mitochondria."</text>
  <rect x="948" y="256" width="180" height="30" rx="15" fill="rgba(245,158,11,0.14)" stroke="#f59e0b" stroke-opacity="0.5"/>
  <text x="1038" y="276" fill="#f59e0b" font-size="12.5" text-anchor="middle" font-weight="700">SEMANTIC_DRIFT</text>

  <!-- hash mismatch row -->
  <rect x="48" y="356" width="1104" height="86" rx="10" fill="#11141c" stroke="#f87171" stroke-opacity="0.4"/>
  <text x="72" y="388" fill="#6b7285" font-size="13">chunk_0417 · tampered mid-scan</text>
  <text x="72" y="414" fill="#c7cbd6" font-size="15">"Water boils at <tspan fill="#f87171" text-decoration="line-through">100°C</tspan> <tspan fill="#f87171" font-weight="700">80°C</tspan> at sea level."</text>
  <rect x="978" y="382" width="150" height="30" rx="15" fill="rgba(248,113,113,0.14)" stroke="#f87171" stroke-opacity="0.5"/>
  <text x="1053" y="402" fill="#f87171" font-size="12.5" text-anchor="middle" font-weight="700">HASH_MISMATCH</text>

  <!-- signature detail -->
  <rect x="48" y="466" width="1104" height="120" rx="10" fill="#11141c" stroke="#20232e"/>
  <text x="72" y="496" fill="#6b7285" font-size="12" letter-spacing="1.2">DUAL SIGNATURE · chunk_0417</text>
  <text x="72" y="528" fill="#969db0" font-size="13">hash (BLAKE3)</text>
  <text x="220" y="528" fill="#e8eaf0" font-size="13">a4f9…20c1</text>
  <text x="380" y="528" fill="#f87171" font-size="13">≠ e01b…77aa</text>
  <text x="72" y="558" fill="#969db0" font-size="13">embedding cosine</text>
  <text x="220" y="558" fill="#e8eaf0" font-size="13">0.94</text>
  <text x="380" y="558" fill="#6b7285" font-size="13">above drift threshold, hash still wins</text>

  <!-- stat strip -->
  <g font-family="Arial, sans-serif">
    <rect x="48" y="610" width="354" height="130" rx="12" fill="#161a24"/>
    <text x="76" y="670" fill="#34d399" font-size="42" font-weight="700">100%</text>
    <text x="76" y="700" fill="#6b7285" font-size="13" font-family="JetBrains Mono, monospace">true-positive rate</text>

    <rect x="422" y="610" width="354" height="130" rx="12" fill="#161a24"/>
    <text x="450" y="670" fill="#22d3ee" font-size="42" font-weight="700">0%</text>
    <text x="450" y="700" fill="#6b7285" font-size="13" font-family="JetBrains Mono, monospace">false-positive rate</text>

    <rect x="796" y="610" width="356" height="130" rx="12" fill="#161a24"/>
    <text x="824" y="670" fill="#f59e0b" font-size="42" font-weight="700">2.73ms</text>
    <text x="824" y="700" fill="#6b7285" font-size="13" font-family="JetBrains Mono, monospace">mean verification overhead</text>
  </g>
</svg>
